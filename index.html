<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">我的书签导航</title>
  <meta name="description" id="page-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">
  <meta name="keywords" id="page-keywords" content="书签,导航,Chrome,书签管理">
  <meta name="author" id="page-author" content="书签管理员">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <meta name="robots" content="index,follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" id="og-title" content="我的书签导航">
  <meta property="og:description" id="og-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="我的书签导航">
  <meta name="twitter:description" id="twitter-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">

  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <style>
    :root {
      --primary-color: #007AFF;
      --background-color: #F2F2F7;
      --card-color: #ffffff;
      --text-color: #1D1D1F;
      --text-secondary: #8E8E93;
      --border-color: #E5E5EA;
      --shadow-color: rgba(0,0,0,0.1);
      --border-radius: 12px;
      --transition-duration: 0.3s;
    }

    [data-theme="dark"] {
      --primary-color: #0A84FF;
      --background-color: #000000;
      --card-color: #1C1C1E;
      --text-color: #FFFFFF;
      --text-secondary: #98989D;
      --border-color: #38383A;
      --shadow-color: rgba(255,255,255,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      transition: all var(--transition-duration) ease;
      overflow-x: hidden;
    }

    /* 毛玻璃效果 */
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
    }

    [data-theme="dark"] .glass-effect {
      background: rgba(28, 28, 30, 0.7);
    }

    /* 平滑滚动 */
    html {
      scroll-behavior: smooth;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
      transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* 加载动画 */
    @keyframes shimmer {
      0% { background-position: -1000px 0; }
      100% { background-position: 1000px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg,
        var(--border-color) 25%,
        rgba(229, 229, 234, 0.3) 50%,
        var(--border-color) 75%);
      background-size: 1000px 100%;
      animation: shimmer 2s infinite;
    }

    /* 微交互动画 */
    .hover-lift {
      transition: all var(--transition-duration) cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    .scale-hover {
      transition: transform var(--transition-duration) ease;
    }

    .scale-hover:hover {
      transform: scale(1.02);
    }

    /* 搜索框样式 */
    .search-input {
      background: var(--card-color);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    /* 书签内容样式 */
    .bookmarks-content {
      min-height: 400px;
    }

    .folder-section {
      border-radius: var(--border-radius);
      background: transparent;
    }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-color);
      margin: 0 0 1rem 0;
      padding: 0.75rem 1rem;
      background: rgba(0, 122, 255, 0.1);
      border-left: 3px solid var(--primary-color);
      border-radius: 0 var(--border-radius) var(--border-radius) 0;
      transition: all 0.2s ease;
    }

    .folder-title:hover {
      background: rgba(0, 122, 255, 0.15);
      transform: translateX(2px);
    }

    .folder-icon {
      font-size: 1.25rem;
    }

    .folder-count {
      margin-left: auto;
      font-size: 0.875rem;
      color: var(--text-secondary);
      background: rgba(0, 122, 255, 0.2);
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .bookmarks-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      margin-left: 1rem;
      padding-left: 1rem;
      border-left: 2px solid var(--border-color);
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      color: var(--text-color);
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .bookmark-item:hover {
      background: rgba(0, 122, 255, 0.05);
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .bookmark-item:active {
      transform: translateY(-1px) scale(0.98);
    }

    .bookmark-icon-wrapper {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bookmark-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .bookmark-default-icon {
      font-size: 1.25rem;
      opacity: 0.6;
    }

    .bookmark-item:hover .bookmark-default-icon {
      opacity: 1;
    }

    .bookmark-info {
      flex: 1;
      min-width: 0;
    }

    .bookmark-title {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-color);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-url {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 深色模式调整 */
    [data-theme="dark"] .folder-title {
      background: rgba(10, 132, 255, 0.15);
      color: #FFFFFF;
    }

    [data-theme="dark"] .folder-title:hover {
      background: rgba(10, 132, 255, 0.2);
    }

    [data-theme="dark"] .bookmarks-list {
      border-left-color: var(--border-color);
    }

    [data-theme="dark"] .bookmark-item {
      background: var(--card-color);
      border-color: var(--border-color);
    }

    [data-theme="dark"] .bookmark-item:hover {
      background: rgba(10, 132, 255, 0.1);
      border-color: #0A84FF;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .bookmarks-list {
        grid-template-columns: 1fr;
        margin-left: 0;
        padding-left: 0;
        border-left: none;
      }

      .folder-section {
        padding: 0.5rem;
      }

      .bookmark-item {
        padding: 0.75rem;
      }

      .folder-title {
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
      }
    }

    /* 卡片样式 */
    .card {
      background: var(--card-color);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      transition: all var(--transition-duration) ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    /* 时钟样式 */
    .clock {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    /* 统计卡片 */
    .stat-card {
      background: linear-gradient(135deg, var(--primary-color), #5856D6);
      color: white;
      transition: all var(--transition-duration) ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.3);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      :root {
        --border-radius: 8px;
      }

      #bookmarks {
        height: calc(100vh - 300px);
      }
    }

    /* 动画入场效果 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* 主题切换动画 */
    .theme-transition {
      transition: all var(--transition-duration) ease;
    }

    /* 高亮搜索结果 */
    .highlight {
      background: rgba(255, 204, 0, 0.3);
      padding: 2px 4px;
      border-radius: 3px;
      animation: highlight-pulse 0.5s ease-in-out;
    }

    @keyframes highlight-pulse {
      0% {
        background: rgba(255, 204, 0, 0.6);
        transform: scale(1.02);
      }
      100% {
        background: rgba(255, 204, 0, 0.3);
        transform: scale(1);
      }
    }

    .bookmark-item.highlight {
      border-color: #FFCC00;
      box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.3);
    }

    .folder-title.highlight {
      border-color: #FFCC00;
      background: rgba(255, 204, 0, 0.15);
    }

    /* Toast提示样式 */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 12px 20px;
      box-shadow: 0 8px 24px var(--shadow-color);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body x-data="navApp()" x-init="init()" :data-theme="theme" class="theme-transition min-h-screen">
  <!-- 主容器 -->
  <div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">

    <!-- 头部导航 -->
    <header class="glass-effect sticky top-0 z-50 animate-in">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <!-- 左侧：标题和统计 -->
          <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg">
                🔖
              </div>
              <div>
                <h1 x-text="config.site.name" class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"></h1>
                <p x-text="config.site.description" class="text-sm text-gray-600 dark:text-gray-400"></p>
              </div>
            </div>

            <!-- 统计信息 -->
            <div x-show="config.header.showStats" class="hidden md:flex items-center space-x-4">
              <div class="stat-card px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold" x-text="stats.totalBookmarks"></span>
                <span class="opacity-90"> 书签</span>
              </div>
              <div class="stat-card px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold" x-text="stats.totalCategories"></span>
                <span class="opacity-90"> 分类</span>
              </div>
            </div>
          </div>

          <!-- 右侧：搜索和工具 -->
          <div class="flex items-center space-x-4">
            <!-- 时钟 -->
            <div x-show="config.header.showClock" class="hidden md:block text-right">
              <div class="text-sm text-gray-600 dark:text-gray-400" x-text="currentTime.date"></div>
              <div class="clock text-lg font-semibold" x-text="currentTime.time"></div>
            </div>

            <!-- 搜索框 -->
            <div x-show="config.header.showSearch" class="relative">
              <input
                type="text"
                x-model="searchQuery"
                @input.debounce.300ms="searchBookmarks()"
                :placeholder="config.header.searchPlaceholder"
                class="search-input w-64 px-4 py-2 pl-10 rounded-lg text-sm focus:outline-none"
              >
              <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </div>

            <!-- 主题切换 -->
            <button
              x-show="config.header.showThemeToggle"
              @click="toggleTheme()"
              class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              :title="theme === 'light' ? '切换到深色模式' : '切换到浅色模式'"
            >
              <svg x-show="theme === 'light'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
              </svg>
              <svg x-show="theme === 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="container mx-auto px-6 py-8">
      <!-- 快速操作栏 -->
      <div x-show="searchQuery" class="mb-6 card p-4 animate-in">
        <div class="flex items-center justify-between">
          <div class="text-sm text-gray-600 dark:text-gray-400">
            搜索 "<span x-text="searchQuery" class="font-semibold"></span>" 的结果：
          </div>
          <button
            @click="clearSearch()"
            class="text-sm text-blue-600 hover:text-blue-800 transition-colors"
          >
            清除搜索
          </button>
        </div>
      </div>

      <!-- 书签容器 -->
      <div class="card p-6 animate-in">
        <!-- 加载状态 -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-12">
          <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
          <p class="text-gray-600 dark:text-gray-400">正在加载书签...</p>
        </div>

        <!-- 书签内容 -->
        <div
          id="bookmarks-container"
          x-show="!loading"
          class="bookmarks-content"
        ></div>
      </div>

      <!-- 底部信息 -->
      <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-400 animate-in">
        <p>🔖 基于 Chrome 书签的现代化导航页面</p>
        <p class="mt-2">
          <span x-text="new Date().getFullYear()"></span> •
          <span x-text="config.site.author"></span>
        </p>
      </footer>
    </main>
  </div>

  <!-- Toast提示容器 -->
  <div id="toast" class="toast">
    <span id="toast-message"></span>
  </div>

  <script>
    // 应用主逻辑
    function navApp() {
      return {
        config: {},
        theme: 'light',
        searchQuery: '',
        loading: true,
        stats: {
          totalBookmarks: 0,
          totalCategories: 0
        },
        currentTime: {
          date: '',
          time: ''
        },
        bookmarksDoc: null,
        parsedBookmarks: [],

        async init() {
          try {
            console.log('开始初始化...');

            // 加载配置
            await this.loadConfig();
            console.log('配置加载完成');

            // 初始化主题
            this.initTheme();

            // 更新页面元信息
            this.updateMeta();

            // 开始时钟
            this.startClock();

            // 加载书签数据
            console.log('开始加载书签...');
            await this.loadBookmarksData();
            console.log('书签数据加载完成，共', this.parsedBookmarks.length, '个文件夹');

            // 渲染书签
            this.renderBookmarks();
            console.log('书签渲染完成');

            // 关键：设置加载完成状态
            this.loading = false;
            this.showToast('书签加载完成', 'success');

          } catch (error) {
            console.error('初始化失败:', error);
            this.loading = false; // 即使失败也要隐藏加载状态
            this.showToast('页面初始化失败: ' + error.message, 'error');
          }
        },

        async loadConfig() {
          try {
            const response = await fetch('config.json');
            this.config = await response.json();

            // 应用主题配置
            if (this.config.theme.mode === 'auto') {
              this.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } else {
              this.theme = this.config.theme.mode;
            }

          } catch (error) {
            console.error('加载配置失败:', error);
            // 使用默认配置
            this.config = {
              site: { name: '我的书签导航', description: '基于Chrome书签的现代化导航页面' },
              header: { showSearch: true, showThemeToggle: true, showStats: true, showClock: true },
              bookmarks: { source: 'bookmarks.html' }
            };
          }
        },

        initTheme() {
          // 监听系统主题变化
          if (this.config.theme?.mode === 'auto') {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
              this.theme = e.matches ? 'dark' : 'light';
            });
          }
        },

        updateMeta() {
          if (this.config.site) {
            document.getElementById('page-title').textContent = this.config.site.title || '我的书签导航';
            document.getElementById('page-description').content = this.config.site.description || '基于Chrome书签的现代化导航页面';
            document.getElementById('page-keywords').content = this.config.site.keywords || '书签,导航,Chrome';
            document.getElementById('page-author').content = this.config.site.author || '书签管理员';
            document.getElementById('favicon').href = this.config.site.favicon || '🔖';
            document.getElementById('theme-color').content = this.config.theme?.primaryColor || '#007AFF';
          }
        },

        toggleTheme() {
          this.theme = this.theme === 'light' ? 'dark' : 'light';
          localStorage.setItem('theme', this.theme);
        },

        startClock() {
          const updateClock = () => {
            const now = new Date();
            this.currentTime.time = now.toLocaleTimeString('zh-CN', {
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });
            this.currentTime.date = now.toLocaleDateString('zh-CN', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              weekday: 'short'
            });
          };

          updateClock();
          setInterval(updateClock, 1000);
        },

        async loadBookmarksData() {
          console.log('开始加载书签文件:', this.config.bookmarks.source);
          const response = await fetch(this.config.bookmarks.source);
          let htmlText = await response.text();
          console.log('原始文件内容长度:', htmlText.length);
          console.log('文件前200个字符:', htmlText.substring(0, 200));

          // 🔧 关键修复：将NETSCAPE格式转换为标准HTML5
          // Chrome导出的书签使用非标准的NETSCAPE DOCTYPE
          // 我们需要替换它以便DOMParser正确解析
          htmlText = htmlText
            .replace(/<!DOCTYPE NETSCAPE-Bookmark-file-1>/gi, '<!DOCTYPE html>')
            .replace(/<META HTTP-EQUIV="Content-Type" CONTENT="text\/html; charset=UTF-8">/gi, '<meta charset="UTF-8">');

          console.log('✓ 已规范化HTML格式');

          // 解析HTML
          const parser = new DOMParser();
          this.bookmarksDoc = parser.parseFromString(htmlText, 'text/html');

          // 检查解析是否成功
          if (this.bookmarksDoc.querySelector('parsererror')) {
            console.error('❌ HTML解析失败！');
            throw new Error('书签文件格式错误，无法解析');
          }

          console.log('✓ HTML解析成功');
          console.log('Document title:', this.bookmarksDoc.title);
          console.log('Body存在:', !!this.bookmarksDoc.body);

          this.parsedBookmarks = this.parseBookmarkStructure(this.bookmarksDoc);
          console.log('✓ 书签解析完成，找到', this.parsedBookmarks.length, '个文件夹');
        },

        parseBookmarkStructure(doc) {
          const structure = [];
          let processedFolders = 0;

          console.log('=== 开始解析书签结构 ===');

          // 🔧 使用更兼容的方法：直接遍历子节点
          const getDirectChildDTs = (element) => {
            const result = [];
            for (let i = 0; i < element.children.length; i++) {
              if (element.children[i].tagName === 'DT') {
                result.push(element.children[i]);
              }
            }
            return result;
          };

          // 递归收集所有包含直接链接的文件夹
          const collectFolders = (dlElement, parentPath = '', depth = 0) => {
            if (!dlElement) {
              console.log('警告：dlElement 为空');
              return;
            }

            const indent = '  '.repeat(depth);
            console.log(`${indent}处理 DL 层级 ${depth}, 父路径: "${parentPath}"`);

            const dtElements = getDirectChildDTs(dlElement);
            console.log(`${indent}找到 ${dtElements.length} 个直接子 DT 元素`);

            for (let i = 0; i < dtElements.length; i++) {
              const dt = dtElements[i];

              // 🔍 详细调试：查看DT的结构
              console.log(`${indent}  [DT ${i+1}] HTML:`, dt.innerHTML.substring(0, 100));

              // 查找H3或A元素（不区分大小写）
              const h3 = dt.querySelector('H3, h3');
              const a = dt.querySelector('A[href], a[href]');

              console.log(`${indent}  [DT ${i+1}] 有H3:`, !!h3, '有A:', !!a);

              if (h3) {
                // 这是一个文件夹
                const folderTitle = h3.textContent.trim();
                const fullPath = parentPath ? `${parentPath} > ${folderTitle}` : folderTitle;
                console.log(`${indent}  📁 文件夹: "${folderTitle}"`);

                // 🔧 关键修复：DL在DT内部，而不是DT的兄弟元素！
                // Chrome书签结构: <DT><H3>标题</H3><DL>...</DL></DT>
                let folderDL = dt.querySelector('DL, dl');

                if (!folderDL) {
                  console.log(`${indent}    ⚠ 在DT内部未找到DL，尝试查找兄弟元素...`);
                  // 备用方案：查找nextElementSibling（某些书签格式可能这样）
                  folderDL = dt.nextElementSibling;
                  while (folderDL && folderDL.tagName === 'P') {
                    folderDL = folderDL.nextElementSibling;
                  }
                  if (folderDL && folderDL.tagName !== 'DL') {
                    folderDL = null;
                  }
                }

                if (!folderDL) {
                  console.log(`${indent}    ⚠ 仍未找到对应的DL，跳过此文件夹`);
                  continue;
                }

                // 收集这个文件夹下的直接链接
                const bookmarks = [];
                const subDTs = getDirectChildDTs(folderDL);
                console.log(`${indent}    包含 ${subDTs.length} 个子项`);

                for (const subDT of subDTs) {
                  const subA = subDT.querySelector('A[href], a[href]');
                  if (subA) {
                    const title = subA.textContent.trim();
                    bookmarks.push({
                      title: title,
                      url: subA.getAttribute('href'),
                      icon: subA.getAttribute('ICON') || subA.getAttribute('icon') || '',
                      addDate: subA.getAttribute('ADD_DATE') || ''
                    });
                    if (depth <= 1) { // 只在前两层打印详细链接
                      console.log(`${indent}      🔗 "${title}"`);
                    }
                  }
                }

                // 如果这个文件夹有直接链接，添加到结果中
                if (bookmarks.length > 0) {
                  structure.push({
                    title: fullPath,
                    bookmarks: bookmarks
                  });
                  processedFolders++;
                  console.log(`${indent}    ✅ "${fullPath}" (${bookmarks.length} 个书签)`);
                }

                // 递归处理子文件夹
                collectFolders(folderDL, fullPath, depth + 1);

              } else if (a && !parentPath) {
                // 顶层直接链接（通常很少见）
                console.log(`${indent}  🔗 顶层链接: "${a.textContent.trim()}"`);
              }
            }
          };

          // 从根 DL 开始解析
          console.log('查找根 DL 元素...');
          const rootDL = doc.querySelector('DL');
          if (!rootDL) {
            console.error('❌ 错误：未找到根 DL 元素');
            console.log('文档body内容:', doc.body ? doc.body.innerHTML.substring(0, 500) : 'body为空');
            return structure;
          }

          console.log('✅ 找到根 DL 元素，开始递归解析...\n');
          collectFolders(rootDL);

          console.log(`\n=== ✅ 解析完成！===`);
          console.log(`📊 统计：${processedFolders} 个文件夹，${structure.reduce((sum, f) => sum + f.bookmarks.length, 0)} 个书签`);

          if (structure.length > 0) {
            console.log('\n📋 示例数据（前2个文件夹）:');
            structure.slice(0, 2).forEach(folder => {
              console.log(`  - ${folder.title}: ${folder.bookmarks.length}个书签`);
            });
          } else {
            console.warn('⚠️ 警告：没有解析到任何书签数据！');
          }

          return structure;
        },

        renderBookmarks() {
          console.log('=== 开始渲染书签 ===');
          const container = document.getElementById('bookmarks-container');

          if (!container) {
            console.error('错误：找不到 bookmarks-container 元素！');
            return;
          }

          console.log('容器元素找到:', container);
          console.log('准备渲染的书签数据:', this.parsedBookmarks);
          console.log('文件夹数量:', this.parsedBookmarks.length);

          if (!this.parsedBookmarks || this.parsedBookmarks.length === 0) {
            console.warn('警告：没有书签数据可渲染');
            container.innerHTML = `
              <div class="card p-8 text-center">
                <p class="text-2xl mb-4">📭</p>
                <p class="text-gray-600 dark:text-gray-400">未找到书签数据</p>
                <p class="text-sm text-gray-500 mt-2">请检查 bookmarks.html 文件</p>
              </div>
            `;
            return;
          }

          let html = '<div class="bookmarks-grid">';

          this.parsedBookmarks.forEach((folder, index) => {
            console.log(`渲染文件夹 ${index + 1}: ${folder.title}, 书签数: ${folder.bookmarks.length}`);

            if (folder.bookmarks.length === 0) return;

            html += `
              <div class="folder-section mb-8">
                <h3 class="folder-title">
                  <span class="folder-icon">📁</span>
                  ${this.escapeHtml(folder.title)}
                  <span class="folder-count">${folder.bookmarks.length} 个书签</span>
                </h3>
                <div class="bookmarks-list">
            `;

            folder.bookmarks.forEach(bookmark => {
              const iconHtml = bookmark.icon ?
                `<img src="${bookmark.icon}" alt="" class="bookmark-icon" onerror="this.style.display='none'">` :
                '<span class="bookmark-default-icon">🔗</span>';

              html += `
                <a href="${this.escapeHtml(bookmark.url)}" class="bookmark-item" target="_blank" rel="noopener noreferrer">
                  <div class="bookmark-icon-wrapper">
                    ${iconHtml}
                  </div>
                  <div class="bookmark-info">
                    <div class="bookmark-title">${this.escapeHtml(bookmark.title)}</div>
                    <div class="bookmark-url">${this.escapeHtml(this.getDomainFromUrl(bookmark.url))}</div>
                  </div>
                </a>
              `;
            });

            html += `
                </div>
              </div>
            `;
          });

          html += '</div>';

          console.log('HTML 生成完成，长度:', html.length);
          container.innerHTML = html;
          console.log('HTML 已插入到容器');

          // 统计书签数量
          this.calculateStats();
          console.log('=== 书签渲染完成 ===');
        },

        escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        },

        getDomainFromUrl(url) {
          try {
            const domain = new URL(url).hostname;
            return domain.replace('www.', '');
          } catch {
            return url;
          }
        },

        calculateStats() {
          try {
            let totalBookmarks = 0;
            this.parsedBookmarks.forEach(folder => {
              totalBookmarks += folder.bookmarks.length;
            });

            this.stats.totalBookmarks = totalBookmarks;
            this.stats.totalCategories = this.parsedBookmarks.length;

          } catch (error) {
            console.error('统计计算失败:', error);
          }
        },

        injectStyles(doc) {
          const style = doc.createElement('style');
          style.textContent = `
            body {
              font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif !important;
              background: transparent !important;
              padding: 0 !important;
              margin: 0 !important;
            }

            h1 {
              display: none !important;
            }

            h3 {
              font-size: 1.125rem !important;
              font-weight: 600 !important;
              color: #1D1D1F !important;
              margin: 1.5rem 0 0.75rem !important;
              padding: 0.5rem 1rem !important;
              background: rgba(0, 122, 255, 0.1) !important;
              border-left: 3px solid #007AFF !important;
              border-radius: 0 8px 8px 0 !important;
              transition: all 0.2s ease !important;
            }

            h3:hover {
              background: rgba(0, 122, 255, 0.15) !important;
              transform: translateX(2px) !important;
            }

            a {
              display: inline-block !important;
              padding: 0.625rem 1.25rem !important;
              margin: 0.25rem !important;
              color: #007AFF !important;
              text-decoration: none !important;
              border-radius: 8px !important;
              transition: all 0.2s ease !important;
              border: 1px solid transparent !important;
              font-size: 0.875rem !important;
              font-weight: 500 !important;
              position: relative !important;
            }

            a:hover {
              background: rgba(0, 122, 255, 0.1) !important;
              border-color: rgba(0, 122, 255, 0.2) !important;
              transform: translateX(4px) !important;
            }

            a:active {
              transform: translateX(2px) scale(0.98) !important;
            }

            a::before {
              content: "🔗" !important;
              margin-right: 0.5rem !important;
              opacity: 0.6 !important;
              transition: opacity 0.2s ease !important;
            }

            a:hover::before {
              opacity: 1 !important;
            }

            dl dl {
              margin-left: 1.5rem !important;
              border-left: 2px solid #E5E5EA !important;
              padding-left: 1rem !important;
              margin-top: 0.5rem !important;
            }

            .highlight {
              background: rgba(255, 204, 0, 0.3) !important;
              padding: 2px 4px !important;
              border-radius: 3px !important;
            }

            /* 深色模式样式 */
            @media (prefers-color-scheme: dark) {
              h3 {
                color: #FFFFFF !important;
                background: rgba(10, 132, 255, 0.15) !important;
              }

              a {
                color: #0A84FF !important;
              }

              a:hover {
                background: rgba(10, 132, 255, 0.15) !important;
                border-color: rgba(10, 132, 255, 0.3) !important;
              }

              dl dl {
                border-left-color: #38383A !important;
              }
            }
          `;
          doc.head.appendChild(style);
        },

        searchBookmarks() {
          if (!this.searchQuery.trim()) {
            this.clearSearch();
            return;
          }

          const container = document.getElementById('bookmarks-container');
          if (!container) return;

          // 清除之前的高亮
          container.querySelectorAll('.highlight').forEach(el => {
            el.classList.remove('highlight');
          });

          // 搜索和高亮
          const bookmarkItems = container.querySelectorAll('.bookmark-item');
          const folderTitles = container.querySelectorAll('.folder-title');
          const folderSections = container.querySelectorAll('.folder-section');

          let matchCount = 0;
          const regex = new RegExp(this.searchQuery, 'gi');

          // 首先隐藏所有文件夹
          folderSections.forEach(section => {
            section.style.display = 'none';
          });

          // 搜索匹配的项目
          [...bookmarkItems, ...folderTitles].forEach(element => {
            const text = element.textContent;
            if (text.match(regex)) {
              // 显示包含匹配项的文件夹
              const folderSection = element.closest('.folder-section');
              if (folderSection) {
                folderSection.style.display = 'block';
              }

              // 高亮匹配的文本
              element.classList.add('highlight');
              matchCount++;
            }
          });

          this.showToast(`找到 ${matchCount} 个匹配结果`, 'info');
        },

        clearSearch() {
          this.searchQuery = '';

          const container = document.getElementById('bookmarks-container');
          if (!container) return;

          // 清除高亮并显示所有文件夹
          container.querySelectorAll('.highlight').forEach(el => {
            el.classList.remove('highlight');
          });

          container.querySelectorAll('.folder-section').forEach(section => {
            section.style.display = 'block';
          });
        },

        showToast(message, type = 'info') {
          const toast = document.getElementById('toast');
          const toastMessage = document.getElementById('toast-message');

          toastMessage.textContent = message;

          // 设置不同类型的样式
          toast.className = 'toast show';
          if (type === 'error') {
            toast.style.borderColor = '#FF3B30';
            toast.style.color = '#FF3B30';
          } else if (type === 'success') {
            toast.style.borderColor = '#34C759';
            toast.style.color = '#34C759';
          } else {
            toast.style.borderColor = '#007AFF';
            toast.style.color = '#007AFF';
          }

          // 3秒后自动隐藏
          setTimeout(() => {
            toast.classList.remove('show');
          }, 3000);
        }
      }
    }
  </script>
</body>
