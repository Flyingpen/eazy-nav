<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">我的书签导航</title>
  <meta name="description" id="page-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">
  <meta name="keywords" id="page-keywords" content="书签,导航,Chrome,书签管理">
  <meta name="author" id="page-author" content="书签管理员">
  <meta name="theme-color" id="theme-color" content="#ffffff">
  <meta name="robots" content="index,follow">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" id="og-title" content="我的书签导航">
  <meta property="og:description" id="og-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twitter-title" content="我的书签导航">
  <meta name="twitter:description" id="twitter-description" content="基于Chrome书签的现代化导航页面，提供精美的交互体验">

  <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔖</text></svg>">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // 深色模式跟随 <html> 上的 .dark 类，与 data-theme 主题变量统一由 JS 控制
    tailwind.config = { darkMode: 'class' };
    // 首帧渲染前应用已保存的主题，避免闪烁
    (function () {
      var saved = localStorage.getItem('theme');
      var dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <style>
    [x-cloak] {
      display: none !important;
    }

    :root {
      --primary-color: #007AFF;
      --background-color: #F2F2F7;
      --card-color: #ffffff;
      --text-color: #1D1D1F;
      --text-secondary: #8E8E93;
      --border-color: #E5E5EA;
      --shadow-color: rgba(0,0,0,0.1);
      --border-radius: 12px;
      --transition-duration: 0.3s;
    }

    [data-theme="dark"] {
      --primary-color: #0A84FF;
      --background-color: #000000;
      --card-color: #1C1C1E;
      --text-color: #FFFFFF;
      --text-secondary: #98989D;
      --border-color: #38383A;
      --shadow-color: rgba(255,255,255,0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      background: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      transition: all var(--transition-duration) ease;
      overflow-x: hidden;
    }

    /* 毛玻璃效果 */
    .glass-effect {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
    }

    [data-theme="dark"] .glass-effect {
      background: rgba(28, 28, 30, 0.7);
    }

    /* 平滑滚动 */
    html {
      scroll-behavior: smooth;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
      transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* 微交互动画 */
    .hover-lift {
      transition: all var(--transition-duration) cubic-bezier(0.4, 0, 0.2, 1);
    }

    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    .scale-hover {
      transition: transform var(--transition-duration) ease;
    }

    .scale-hover:hover {
      transform: scale(1.02);
    }

    /* 搜索框样式 */
    .search-input {
      background: var(--card-color);
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
    }

    /* 书签内容样式 */
    .bookmarks-content {
      min-height: 400px;
    }

    .folder-section {
      border-radius: var(--border-radius);
      background: transparent;
    }

    .folder-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-color);
      margin: 0 0 1rem 0;
      padding: 0.75rem 1rem;
      background: rgba(0, 122, 255, 0.1);
      border-left: 3px solid var(--primary-color);
      border-radius: 0 var(--border-radius) var(--border-radius) 0;
      transition: all 0.2s ease;
    }

    .folder-title:hover {
      background: rgba(0, 122, 255, 0.15);
      transform: translateX(2px);
    }

    .folder-icon {
      font-size: 1.25rem;
    }

    .folder-count {
      margin-left: auto;
      font-size: 0.875rem;
      color: var(--text-secondary);
      background: rgba(0, 122, 255, 0.2);
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-weight: 500;
    }

    .bookmarks-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
      margin-left: 1rem;
      padding-left: 1rem;
      border-left: 2px solid var(--border-color);
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.875rem;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      color: var(--text-color);
      text-decoration: none;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .bookmark-item:hover {
      background: rgba(0, 122, 255, 0.05);
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--shadow-color);
    }

    .bookmark-item:active {
      transform: translateY(-1px) scale(0.98);
    }

    .bookmark-icon-wrapper {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bookmark-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }

    .bookmark-default-icon {
      font-size: 1.25rem;
      opacity: 0.6;
    }

    .bookmark-item:hover .bookmark-default-icon {
      opacity: 1;
    }

    .bookmark-info {
      flex: 1;
      min-width: 0;
    }

    .bookmark-title {
      font-weight: 500;
      font-size: 0.875rem;
      color: var(--text-color);
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bookmark-url {
      font-size: 0.75rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 深色模式调整 */
    [data-theme="dark"] .folder-title {
      background: rgba(10, 132, 255, 0.15);
      color: #FFFFFF;
    }

    [data-theme="dark"] .folder-title:hover {
      background: rgba(10, 132, 255, 0.2);
    }

    [data-theme="dark"] .bookmarks-list {
      border-left-color: var(--border-color);
    }

    [data-theme="dark"] .bookmark-item {
      background: var(--card-color);
      border-color: var(--border-color);
    }

    [data-theme="dark"] .bookmark-item:hover {
      background: rgba(10, 132, 255, 0.1);
      border-color: #0A84FF;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .bookmarks-list {
        grid-template-columns: 1fr;
        margin-left: 0;
        padding-left: 0;
        border-left: none;
      }

      .folder-section {
        padding: 0.5rem;
      }

      .bookmark-item {
        padding: 0.75rem;
      }

      .folder-title {
        padding: 0.5rem 0.75rem;
        font-size: 1rem;
      }
    }

    /* 卡片样式 */
    .card {
      background: var(--card-color);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      transition: all var(--transition-duration) ease;
    }

    .card:hover {
      box-shadow: 0 8px 24px var(--shadow-color);
    }

    /* 时钟样式 */
    .clock {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    /* 统计卡片 */
    .stat-card {
      background: linear-gradient(135deg, var(--primary-color), #5856D6);
      color: white;
      transition: all var(--transition-duration) ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(0, 122, 255, 0.3);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      :root {
        --border-radius: 8px;
      }
    }

    /* 动画入场效果 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-in {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    /* 主题切换动画 */
    .theme-transition {
      transition: all var(--transition-duration) ease;
    }

    /* 高亮搜索结果 */
    .highlight {
      background: rgba(255, 204, 0, 0.3);
      padding: 2px 4px;
      border-radius: 3px;
      animation: highlight-pulse 0.5s ease-in-out;
    }

    @keyframes highlight-pulse {
      0% {
        background: rgba(255, 204, 0, 0.6);
        transform: scale(1.02);
      }
      100% {
        background: rgba(255, 204, 0, 0.3);
        transform: scale(1);
      }
    }

    .bookmark-item.highlight {
      border-color: #FFCC00;
      box-shadow: 0 0 0 2px rgba(255, 204, 0, 0.3);
    }

    .folder-title.highlight {
      border-color: #FFCC00;
      background: rgba(255, 204, 0, 0.15);
    }

    /* Toast提示样式 */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--card-color);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 12px 20px;
      box-shadow: 0 8px 24px var(--shadow-color);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body x-data="navApp()" x-init="init()" class="theme-transition min-h-screen">
  <!-- 主容器 -->
  <div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-purple-50 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900">

    <!-- 头部导航 -->
    <header x-cloak class="glass-effect sticky top-0 z-50 animate-in">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
          <!-- 左侧：标题和统计 -->
          <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center text-white font-bold text-lg shadow-lg">
                🔖
              </div>
              <div>
                <h1 x-text="config.site.name" class="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent"></h1>
                <p x-text="config.site.description" class="text-sm text-gray-600 dark:text-gray-400"></p>
              </div>
            </div>

            <!-- 统计信息 -->
            <div x-show="config.header.showStats" class="hidden md:flex items-center space-x-4">
              <div class="stat-card px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold" x-text="stats.totalBookmarks"></span>
                <span class="opacity-90"> 书签</span>
              </div>
              <div class="stat-card px-4 py-2 rounded-lg text-sm">
                <span class="font-semibold" x-text="stats.totalCategories"></span>
                <span class="opacity-90"> 分类</span>
              </div>
            </div>
          </div>

          <!-- 右侧：搜索和工具 -->
          <div class="flex items-center space-x-4">
            <!-- 时钟 -->
            <div x-show="config.header.showClock" class="hidden md:block text-right">
              <div class="text-sm text-gray-600 dark:text-gray-400" x-text="currentTime.date"></div>
              <div class="clock text-lg font-semibold" x-text="currentTime.time"></div>
            </div>

            <!-- 搜索框 -->
            <div x-show="config.header.showSearch" class="relative">
              <input
                type="text"
                x-model="searchQuery"
                @input.debounce.300ms="searchBookmarks()"
                :placeholder="config.header.searchPlaceholder"
                class="search-input w-64 px-4 py-2 pl-10 rounded-lg text-sm focus:outline-none"
              >
              <svg class="absolute left-3 top-2.5 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
              </svg>
            </div>

            <!-- 主题切换 -->
            <button
              x-show="config.header.showThemeToggle"
              @click="toggleTheme()"
              class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
              :title="theme === 'light' ? '切换到深色模式' : '切换到浅色模式'"
            >
              <svg x-show="theme === 'light'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
              </svg>
              <svg x-show="theme === 'dark'" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- 主内容区域 -->
    <main class="container mx-auto px-6 py-8">
      <!-- 快速操作栏 -->
      <div x-show="searchQuery" class="mb-6 card p-4 animate-in">
        <div class="flex items-center justify-between">
          <div class="text-sm text-gray-600 dark:text-gray-400">
            搜索 "<span x-text="searchQuery" class="font-semibold"></span>" 的结果：
          </div>
          <button
            @click="clearSearch()"
            class="text-sm text-blue-600 hover:text-blue-800 transition-colors"
          >
            清除搜索
          </button>
        </div>
      </div>

      <!-- 书签容器 -->
      <div class="card p-6 animate-in">
        <!-- 加载状态 -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-12">
          <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
          <p class="text-gray-600 dark:text-gray-400">正在加载书签...</p>
        </div>

        <!-- 书签内容 -->
        <div
          id="bookmarks-container"
          x-show="!loading"
          class="bookmarks-content"
        ></div>
      </div>

      <!-- 底部信息 -->
      <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-400 animate-in">
        <p>
          <span x-text="new Date().getFullYear()"></span> •
          <span x-text="config.site.author"></span> •
          <a href="https://github.com/Flyingpen/eazy-nav" target="_blank" rel="noopener noreferrer" class="hover:text-blue-500 transition-colors">GitHub</a>
        </p>
      </footer>
    </main>
  </div>

  <!-- Toast提示容器 -->
  <div id="toast" class="toast">
    <span id="toast-message"></span>
  </div>

  <script>
    // 应用主逻辑
    function navApp() {
      return {
        config: {},
        theme: 'light',
        searchQuery: '',
        loading: true,
        stats: {
          totalBookmarks: 0,
          totalCategories: 0
        },
        currentTime: {
          date: '',
          time: ''
        },
        parsedBookmarks: [],

        async init() {
          try {
            // 加载配置（内部会根据 config 与 localStorage 初始化主题）
            await this.loadConfig();

            // 更新页面元信息
            this.updateMeta();

            // 开始时钟
            this.startClock();

            // 加载并渲染书签
            await this.loadBookmarksData();
            this.renderBookmarks();

            this.loading = false;
          } catch (error) {
            console.error('初始化失败:', error);
            this.loading = false; // 即使失败也要隐藏加载状态
            this.showToast('页面初始化失败: ' + error.message, 'error');
          }
        },

        async loadConfig() {
          const defaultConfig = {
            site: {
              title: '我的书签导航',
              name: '智能书签导航',
              description: '基于 Chrome 书签的现代化导航页面',
              keywords: '书签,导航,Chrome',
              author: 'Flyingpen',
              favicon: ''
            },
            theme: { mode: 'auto', primaryColor: '#007AFF' },
            header: {
              showSearch: true,
              showThemeToggle: true,
              showStats: true,
              showClock: true,
              searchPlaceholder: '搜索书签...'
            },
            bookmarks: { source: 'bookmarks.html' }
          };

          try {
            const response = await fetch('config.json');
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const loaded = await response.json();
            // 与默认配置合并，保证缺少的键有兜底值
            this.config = {
              ...defaultConfig,
              ...loaded,
              site: { ...defaultConfig.site, ...loaded.site },
              theme: { ...defaultConfig.theme, ...loaded.theme },
              header: { ...defaultConfig.header, ...loaded.header },
              bookmarks: { ...defaultConfig.bookmarks, ...loaded.bookmarks }
            };
          } catch (error) {
            console.warn('加载 config.json 失败，使用默认配置:', error.message);
            this.config = defaultConfig;
          }

          // config.theme.mode 只决定"默认主题"；
          // 用户手动切换过主题（localStorage 有值）时以用户选择为准
          if (localStorage.getItem('theme') === null) {
            if (this.config.theme.mode === 'auto') {
              this.applyTheme(
                window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
                false
              );
              this.watchSystemTheme();
            } else {
              this.applyTheme(this.config.theme.mode === 'dark' ? 'dark' : 'light', false);
            }
          } else {
            // 同步 Alpine 状态与首帧脚本已应用的主题
            this.theme = localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
          }
        },

        watchSystemTheme() {
          // 仅在用户未手动选择主题时跟随系统
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (localStorage.getItem('theme') === null) {
              this.applyTheme(e.matches ? 'dark' : 'light', false);
            }
          });
        },

        applyTheme(theme, persist = true) {
          this.theme = theme;
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          const meta = document.getElementById('theme-color');
          if (meta) {
            meta.content = theme === 'dark'
              ? '#000000'
              : (this.config.theme?.primaryColor || '#ffffff');
          }
          if (persist) localStorage.setItem('theme', theme);
        },

        updateMeta() {
          if (!this.config.site) return;
          const site = this.config.site;
          document.getElementById('page-title').textContent = site.title || '我的书签导航';
          document.getElementById('page-description').content = site.description || '';
          document.getElementById('page-keywords').content = site.keywords || '';
          document.getElementById('page-author').content = site.author || '';
          const favicon = document.getElementById('favicon');
          if (favicon && site.favicon) favicon.href = site.favicon;
        },

        toggleTheme() {
          this.applyTheme(this.theme === 'light' ? 'dark' : 'light');
        },

        startClock() {
          const updateClock = () => {
            const now = new Date();
            this.currentTime.time = now.toLocaleTimeString('zh-CN', {
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit'
            });
            this.currentTime.date = now.toLocaleDateString('zh-CN', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              weekday: 'short'
            });
          };

          updateClock();
          setInterval(updateClock, 1000);
        },

        async loadBookmarksData() {
          const response = await fetch(this.config.bookmarks.source);
          if (!response.ok) {
            throw new Error(`书签文件加载失败 (HTTP ${response.status})`);
          }
          let htmlText = await response.text();

          // Chrome 导出的书签使用非标准的 NETSCAPE DOCTYPE，
          // 需转换为标准 HTML5 以便 DOMParser 正确解析
          htmlText = htmlText
            .replace(/<!DOCTYPE NETSCAPE-Bookmark-file-1>/gi, '<!DOCTYPE html>')
            .replace(/<META HTTP-EQUIV="Content-Type" CONTENT="text\/html; charset=UTF-8">/gi, '<meta charset="UTF-8">');

          const parser = new DOMParser();
          const doc = parser.parseFromString(htmlText, 'text/html');

          if (doc.querySelector('parsererror')) {
            throw new Error('书签文件格式错误，无法解析');
          }

          this.parsedBookmarks = this.parseBookmarkStructure(doc);
        },

        parseBookmarkStructure(doc) {
          const structure = [];

          // 收集元素的直接子 DT。
          // 不用 querySelector('DT')：它会穿透嵌套层级，把子层级元素误当成当前层级
          const getDirectChildDTs = (element) => {
            const result = [];
            for (const child of element.children) {
              if (child.tagName === 'DT') result.push(child);
            }
            return result;
          };

          // 递归收集所有包含直接链接的文件夹
          const collectFolders = (dlElement, parentPath = '') => {
            if (!dlElement) return;

            for (const dt of getDirectChildDTs(dlElement)) {
              // :scope > 限定只匹配 DT 的直接子元素。
              // Chrome 书签结构: <DT><H3>标题</H3><DL>子项...</DL></DT>
              // 若用普通 querySelector('A[href]')，会匹配到子文件夹里的第一个链接，
              // 导致子文件夹的第一个书签被误当成子文件夹本身（幽灵书签）
              const h3 = dt.querySelector(':scope > H3');
              const a = dt.querySelector(':scope > A[href]');

              if (h3) {
                // 这是一个文件夹
                const folderTitle = h3.textContent.trim();
                const fullPath = parentPath ? `${parentPath} / ${folderTitle}` : folderTitle;

                let folderDL = dt.querySelector(':scope > DL');
                if (!folderDL) {
                  // 备用方案：某些书签格式把 DL 放在 DT 的兄弟位置
                  let sibling = dt.nextElementSibling;
                  while (sibling && sibling.tagName === 'P') {
                    sibling = sibling.nextElementSibling;
                  }
                  if (sibling && sibling.tagName === 'DL') folderDL = sibling;
                }
                if (!folderDL) continue;

                // 收集这个文件夹下的直接链接
                const bookmarks = [];
                for (const subDT of getDirectChildDTs(folderDL)) {
                  const subA = subDT.querySelector(':scope > A[href]');
                  if (subA) {
                    bookmarks.push({
                      title: subA.textContent.trim(),
                      url: subA.getAttribute('href'),
                      icon: subA.getAttribute('ICON') || ''
                    });
                  }
                }

                // 只要这个文件夹有直接链接就加入结果
                if (bookmarks.length > 0) {
                  structure.push({ title: fullPath, bookmarks });
                }

                // 递归处理子文件夹
                collectFolders(folderDL, fullPath);
              } else if (a && !parentPath) {
                // 顶层直接链接（较少见），归入"未分类"
                if (!structure._topLevel) {
                  structure._topLevel = { title: '未分类', bookmarks: [] };
                  structure.push(structure._topLevel);
                }
                structure._topLevel.bookmarks.push({
                  title: a.textContent.trim(),
                  url: a.getAttribute('href'),
                  icon: a.getAttribute('ICON') || ''
                });
              }
            }
          };

          const rootDL = doc.querySelector('DL');
          if (!rootDL) return structure;

          collectFolders(rootDL);
          return structure;
        },

        renderBookmarks() {
          const container = document.getElementById('bookmarks-container');
          if (!container) return;

          if (!this.parsedBookmarks || this.parsedBookmarks.length === 0) {
            container.innerHTML = `
              <div class="card p-8 text-center">
                <p class="text-2xl mb-4">📭</p>
                <p class="text-gray-600 dark:text-gray-400">未找到书签数据</p>
                <p class="text-sm text-gray-500 dark:text-gray-500 mt-2">请检查 bookmarks.html 文件</p>
              </div>
            `;
            return;
          }

          let html = '<div class="bookmarks-grid">';

          this.parsedBookmarks.forEach((folder) => {
            if (folder.bookmarks.length === 0) return;

            html += `
              <div class="folder-section mb-8">
                <h3 class="folder-title">
                  <span class="folder-icon">📁</span>
                  ${this.escapeHtml(folder.title)}
                  <span class="folder-count">${folder.bookmarks.length} 个书签</span>
                </h3>
                <div class="bookmarks-list">
            `;

            folder.bookmarks.forEach(bookmark => {
              // 图标仅接受 http(s)/data:image 地址且属性值转义，
              // 防止恶意书签文件注入 javascript: URL 或破坏属性边界
              const icon = bookmark.icon || '';
              const safeIcon = /^(https?:\/\/|data:image\/)/i.test(icon) ? this.escapeHtml(icon) : '';
              const iconHtml = safeIcon
                ? `<img src="${safeIcon}" alt="" class="bookmark-icon" loading="lazy" onerror="this.style.display='none'">`
                : '<span class="bookmark-default-icon">🔗</span>';

              html += `
                <a href="${this.escapeHtml(bookmark.url)}" class="bookmark-item" target="_blank" rel="noopener noreferrer">
                  <div class="bookmark-icon-wrapper">
                    ${iconHtml}
                  </div>
                  <div class="bookmark-info">
                    <div class="bookmark-title">${this.escapeHtml(bookmark.title)}</div>
                    <div class="bookmark-url">${this.escapeHtml(this.getDomainFromUrl(bookmark.url))}</div>
                  </div>
                </a>
              `;
            });

            html += `
                </div>
              </div>
            `;
          });

          html += '</div>';
          container.innerHTML = html;

          this.calculateStats();
        },

        escapeHtml(text) {
          const div = document.createElement('div');
          div.textContent = text == null ? '' : String(text);
          // div.innerHTML 不会转义引号，而引号能跳出 HTML 属性边界，必须手动补上
          return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        },

        getDomainFromUrl(url) {
          try {
            // 只去掉开头的前缀 "www."，避免误伤路径里含 www. 的情况
            return new URL(url).hostname.replace(/^www\./, '');
          } catch {
            return url;
          }
        },

        calculateStats() {
          let totalBookmarks = 0;
          this.parsedBookmarks.forEach(folder => {
            totalBookmarks += folder.bookmarks.length;
          });
          this.stats.totalBookmarks = totalBookmarks;
          this.stats.totalCategories = this.parsedBookmarks.length;
        },

        searchBookmarks() {
          if (!this.searchQuery.trim()) {
            this.clearSearch();
            return;
          }

          const container = document.getElementById('bookmarks-container');
          if (!container) return;

          // 清除之前的高亮
          container.querySelectorAll('.highlight').forEach(el => {
            el.classList.remove('highlight');
          });

          const bookmarkItems = container.querySelectorAll('.bookmark-item');
          const folderTitles = container.querySelectorAll('.folder-title');
          const folderSections = container.querySelectorAll('.folder-section');

          // 转义正则特殊字符，避免输入 ( [ + 等字符时 new RegExp 抛异常
          const escaped = this.searchQuery.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp(escaped, 'gi');

          // 首先隐藏所有文件夹
          folderSections.forEach(section => {
            section.style.display = 'none';
          });

          // 搜索匹配的项目
          let matchCount = 0;
          [...bookmarkItems, ...folderTitles].forEach(element => {
            if (element.textContent.match(regex)) {
              // 显示包含匹配项的文件夹
              const folderSection = element.closest('.folder-section');
              if (folderSection) {
                folderSection.style.display = 'block';
              }
              element.classList.add('highlight');
              matchCount++;
            }
          });

          this.showToast(`找到 ${matchCount} 个匹配结果`, 'info');
        },

        clearSearch() {
          this.searchQuery = '';

          const container = document.getElementById('bookmarks-container');
          if (!container) return;

          // 清除高亮并显示所有文件夹
          container.querySelectorAll('.highlight').forEach(el => {
            el.classList.remove('highlight');
          });
          container.querySelectorAll('.folder-section').forEach(section => {
            section.style.display = 'block';
          });
        },

        showToast(message, type = 'info') {
          const toast = document.getElementById('toast');
          const toastMessage = document.getElementById('toast-message');
          if (!toast || !toastMessage) return;

          toastMessage.textContent = message;

          toast.className = 'toast show';
          const colors = { error: '#FF3B30', success: '#34C759', info: '#007AFF' };
          const color = colors[type] || colors.info;
          toast.style.borderColor = color;
          toast.style.color = color;

          // 连续弹出的新 toast 会重置旧计时器，避免闪烁
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => {
            toast.classList.remove('show');
          }, 3000);
        }
      }
    }

    // Service Worker：仅在实际部署的 HTTP(S) 环境注册（file:// 下不可用）
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((error) => {
          console.warn('Service Worker 注册失败:', error.message);
        });
      });
    }
  </script>
</body>
</html>
